<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 뭐 먹지? 🍽️</title>
  <style>
    /* ===== 색상 모음 (여기서 색을 바꾸면 전체 분위기가 바뀌어요) ===== */
    :root {
      --bg: #FFF8E7;          /* 크림색 배경 */
      --card: #FFFFFF;        /* 카드 배경 */
      --orange: #FF8A3D;      /* 주황 포인트 */
      --orange-dark: #E8701F; /* 진한 주황 (눌렀을 때) */
      --orange-soft: #FFE6D2; /* 연한 주황 */
      --text: #4A3B2F;        /* 기본 글자색 */
      --text-soft: #8A7766;   /* 보조 글자색 */
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      display: flex;
      justify-content: center;
      padding: 32px 16px 48px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    h1 {
      font-size: clamp(1.9rem, 7vw, 2.6rem);
      margin: 8px 0 8px;
      color: var(--orange-dark);
    }

    .intro {
      font-size: 1.05rem;
      color: var(--text-soft);
      margin: 0 0 28px;
      line-height: 1.6;
      word-break: keep-all;
    }

    /* ----- 음식 종류 버튼 ----- */
    .categories {
      display: flex;
      flex-wrap: wrap;           /* 화면이 좁으면 자연스럽게 줄바꿈 */
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .category-btn {
      font: inherit;
      font-size: 1rem;
      padding: 10px 18px;
      min-height: 44px;
      border: 2px solid var(--orange-soft);
      border-radius: 999px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, border-color 0.15s;
    }

    .category-btn:hover { border-color: var(--orange); }

    /* 선택된 버튼 */
    .category-btn.active {
      background: var(--orange);
      border-color: var(--orange);
      color: #fff;
      font-weight: bold;
      transform: scale(1.06);
      box-shadow: 0 4px 10px rgba(255, 138, 61, 0.35);
    }

    /* ----- 추천 버튼 ----- */
    .main-btn {
      font: inherit;
      font-size: 1.15rem;
      font-weight: bold;
      width: 100%;
      max-width: 320px;
      padding: 16px 24px;
      border: none;
      border-radius: 999px;
      background: var(--orange);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--orange-dark);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .main-btn:hover { filter: brightness(1.05); }

    .main-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--orange-dark);
    }

    /* ----- 결과 카드 ----- */
    .result-card {
      margin-top: 32px;
      background: var(--card);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 8px 24px rgba(74, 59, 47, 0.08);
      border: 3px dashed var(--orange-soft);
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .result-emoji {
      font-size: 5rem;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .result-category {
      display: inline-block;
      font-size: 0.9rem;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--orange-soft);
      color: var(--orange-dark);
      font-weight: bold;
      margin-bottom: 10px;
    }

    .result-name {
      font-size: 1.8rem;
      font-weight: bold;
      margin: 0 0 8px;
    }

    .result-desc {
      font-size: 1.05rem;
      color: var(--text-soft);
      margin: 0;
      line-height: 1.6;
      word-break: keep-all;
    }

    .placeholder {
      font-size: 1.15rem;
      color: var(--text-soft);
      margin: 0;
      word-break: keep-all;
    }

    /* 결과 카드가 나타날 때 통통 튀는 애니메이션 */
    .pop {
      animation: pop 0.45s ease-out;
    }

    @keyframes pop {
      0%   { opacity: 0; transform: scale(0.85) translateY(10px); }
      60%  { opacity: 1; transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    /* 다시 추천 버튼 */
    .retry-btn {
      font: inherit;
      font-size: 1rem;
      font-weight: bold;
      margin-top: 20px;
      padding: 12px 24px;
      min-height: 44px;
      border: 2px solid var(--orange);
      border-radius: 999px;
      background: #fff;
      color: var(--orange-dark);
      cursor: pointer;
      transition: background 0.15s;
    }

    .retry-btn:hover { background: var(--orange-soft); }

    .hidden { display: none; }

    /* 키보드로 이동할 때 잘 보이도록 */
    button:focus-visible {
      outline: 3px solid var(--text);
      outline-offset: 3px;
    }

    /* 휴대폰 화면 */
    @media (max-width: 420px) {
      body { padding-top: 24px; }
      .category-btn { padding: 10px 16px; }
      .result-emoji { font-size: 4.2rem; }
      .result-name { font-size: 1.6rem; }
    }

    /* 움직임 줄이기 설정을 켠 사용자를 위해 */
    @media (prefers-reduced-motion: reduce) {
      .pop { animation: none; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>오늘 뭐 먹지? 🍽️</h1>
    <p class="intro">음식 종류를 고르면 오늘의 점심을 추천해 드려요.</p>

    <!-- 음식 종류 버튼은 JavaScript가 자동으로 만들어요 -->
    <div class="categories" id="categories"></div>

    <button class="main-btn" id="recommendBtn">점심 메뉴 추천받기</button>

    <section class="result-card" id="resultCard" aria-live="polite">
      <p class="placeholder">오늘의 점심, 함께 골라볼까요?</p>
    </section>

    <button class="retry-btn hidden" id="retryBtn">🔄 다시 추천</button>
  </main>

  <script>
    // =====================================================
    // ✏️ 메뉴 목록 — 학생들이 수정하는 곳!
    // -----------------------------------------------------
    // 메뉴 하나는 { 이름, 종류, 이모지, 설명 } 네 가지로 이루어져 있어요.
    //  - name     : 메뉴 이름
    //  - category : 음식 종류 (반드시 "한식", "중식", "일식", "양식", "분식" 중 하나)
    //  - emoji    : 메뉴를 나타내는 이모지
    //  - desc     : 짧은 설명
    // 메뉴를 추가하려면 { ... }, 한 줄을 복사해서 붙여넣고 내용을 바꾸세요.
    // 각 줄 끝의 쉼표(,)를 빠뜨리지 않도록 조심하세요!
    // =====================================================
    const MENUS = [
      // ----- 한식 -----
      { name: "김치찌개",   category: "한식", emoji: "🍲", desc: "보글보글 얼큰한 국물에 밥 한 공기 뚝딱!" },
      { name: "비빔밥",     category: "한식", emoji: "🥗", desc: "알록달록 나물과 고추장을 쓱쓱 비벼요." },
      { name: "불고기",     category: "한식", emoji: "🥩", desc: "달콤 짭짤한 양념 고기로 든든하게." },
      { name: "된장찌개",   category: "한식", emoji: "🥘", desc: "구수한 된장 향이 마음까지 따뜻하게." },
      { name: "제육볶음",   category: "한식", emoji: "🍖", desc: "매콤한 돼지고기 볶음, 밥도둑 인정!" },

      // ----- 중식 -----
      { name: "짜장면",     category: "중식", emoji: "🍜", desc: "까만 춘장 소스에 쫄깃한 면발." },
      { name: "짬뽕",       category: "중식", emoji: "🌶️", desc: "해물 가득 얼큰한 빨간 국물." },
      { name: "탕수육",     category: "중식", emoji: "🍤", desc: "바삭한 튀김에 새콤달콤 소스!" },
      { name: "볶음밥",     category: "중식", emoji: "🍳", desc: "불맛 가득 고슬고슬한 볶음밥." },
      { name: "마파두부",   category: "중식", emoji: "🥢", desc: "부드러운 두부에 얼얼한 소스." },

      // ----- 일식 -----
      { name: "초밥",       category: "일식", emoji: "🍣", desc: "신선한 생선을 올린 한입 초밥." },
      { name: "라멘",       category: "일식", emoji: "🍥", desc: "진한 국물에 차슈를 올린 라멘." },
      { name: "돈카츠",     category: "일식", emoji: "🍱", desc: "겉바속촉 두툼한 돈카츠!" },
      { name: "우동",       category: "일식", emoji: "🍲", desc: "통통한 면발과 시원한 국물." },
      { name: "규동",       category: "일식", emoji: "🍚", desc: "달큰한 소고기를 듬뿍 올린 덮밥." },

      // ----- 양식 -----
      { name: "파스타",     category: "양식", emoji: "🍝", desc: "토마토? 크림? 오늘은 파스타!" },
      { name: "피자",       category: "양식", emoji: "🍕", desc: "치즈가 쭉~ 늘어나는 피자 한 조각." },
      { name: "햄버거",     category: "양식", emoji: "🍔", desc: "두툼한 패티를 꽉 채운 버거." },
      { name: "샌드위치",   category: "양식", emoji: "🥪", desc: "가볍고 상큼하게 즐기는 한 끼." },
      { name: "스테이크",   category: "양식", emoji: "🥩", desc: "오늘은 특별하게, 육즙 가득 스테이크." },

      // ----- 분식 -----
      { name: "떡볶이",     category: "분식", emoji: "🌶️", desc: "쫀득한 떡에 달콤 매콤 소스." },
      { name: "김밥",       category: "분식", emoji: "🍙", desc: "속이 꽉 찬 김밥 한 줄!" },
      { name: "라면",       category: "분식", emoji: "🍜", desc: "언제 먹어도 맛있는 꼬들꼬들 라면." },
      { name: "순대",       category: "분식", emoji: "🌭", desc: "쫄깃한 순대에 소금 콕!" },
      { name: "튀김",       category: "분식", emoji: "🍤", desc: "바삭바삭 갓 튀긴 모둠 튀김." },
    ];

    // ✏️ 음식 종류 버튼 목록 (순서를 바꾸거나 새 종류를 추가할 수 있어요)
    // 새 종류를 추가했다면 위 MENUS에도 그 종류의 메뉴를 꼭 넣어 주세요.
    const CATEGORIES = ["전체", "한식", "중식", "일식", "양식", "분식"];

    // =====================================================
    // 아래부터는 프로그램 동작 부분이에요. (수정하지 않아도 돼요)
    // =====================================================
    let selectedCategory = "전체"; // 처음에는 '전체' 선택
    let lastMenu = null;           // 직전에 추천한 메뉴

    const categoriesEl = document.getElementById("categories");
    const recommendBtn = document.getElementById("recommendBtn");
    const retryBtn = document.getElementById("retryBtn");
    const resultCard = document.getElementById("resultCard");

    // 음식 종류 버튼 만들기
    CATEGORIES.forEach(function (category) {
      const btn = document.createElement("button");
      btn.className = "category-btn";
      btn.textContent = category;
      btn.setAttribute("aria-pressed", category === selectedCategory);
      if (category === selectedCategory) btn.classList.add("active");

      btn.addEventListener("click", function () {
        selectedCategory = category;
        document.querySelectorAll(".category-btn").forEach(function (b) {
          const isActive = b.textContent === category;
          b.classList.toggle("active", isActive);
          b.setAttribute("aria-pressed", isActive);
        });
      });

      categoriesEl.appendChild(btn);
    });

    // 선택한 종류에서 메뉴 하나를 무작위로 고르기 (직전 메뉴는 제외)
    function pickMenu() {
      let candidates = selectedCategory === "전체"
        ? MENUS
        : MENUS.filter(function (m) { return m.category === selectedCategory; });

      // 고를 메뉴가 2개 이상일 때만 직전 메뉴를 빼요
      if (lastMenu && candidates.length > 1) {
        candidates = candidates.filter(function (m) { return m !== lastMenu; });
      }

      if (candidates.length === 0) return null;
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    // 결과 카드에 메뉴 보여주기
    function showResult() {
      const menu = pickMenu();

      if (!menu) {
        resultCard.innerHTML = '<p class="placeholder">이 종류에는 아직 메뉴가 없어요 😢</p>';
      } else {
        lastMenu = menu;
        resultCard.innerHTML =
          '<div class="result-emoji">' + menu.emoji + '</div>' +
          '<span class="result-category">' + menu.category + '</span>' +
          '<h2 class="result-name">' + menu.name + '</h2>' +
          '<p class="result-desc">' + menu.desc + '</p>';
      }

      // 애니메이션을 매번 다시 재생하기
      resultCard.classList.remove("pop");
      void resultCard.offsetWidth;
      resultCard.classList.add("pop");

      retryBtn.classList.remove("hidden");
    }

    recommendBtn.addEventListener("click", showResult);
    retryBtn.addEventListener("click", showResult);
  </script>
</body>
</html>
